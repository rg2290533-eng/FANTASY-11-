{i+1}</b><div class=g>{x.s.toFixed(1)}</b></div>:'').join('');return<div class=card><b>🏅 आपकी टीमें</b>{b[0].u} · {(m.ev||[]).slice(0,15).map(e=><div class=row&gt;&lt;div class=g&gt;${e.n}${e.v==25?' 🎯 विकेट':''}&lt;small&gt;${m.sp=='cricket'?(e.t/6|0)+'.'+e.t%6+' ओवर':'मिनट '+e.t}</small></div><b style="color:${e.v&lt;0?'#ff6b7a':'#5ee08f'}"&gt;${e.v>0?'+':''}${e.v}&lt;/b&gt;&lt;/div>).join('')||'<small>मैच शुरू होने का इंतज़ार…</small>'}</div>`};
